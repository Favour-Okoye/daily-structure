name: reminders

on:
  schedule:
    # GitHub's scheduler often runs hours late, so wake every 20 minutes;
    # the script only speaks inside the real Brussels windows, once each.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Force a slot for testing (midday or evening)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install web-push@3 --no-save --silent
        working-directory: scripts

      - run: node scripts/send-reminders.mjs
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          FORCE_SLOT: ${{ inputs.slot }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: "BLT2LtJrdTlaO3JoeGp_dUAnjMnXv99sDkD6mjtqIIO8YsGKYCEfmO5NlS51JkMUG4r8--5Zp-P2TduXjaFyEN0"
